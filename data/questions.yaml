# ==========================================
# OSCP - Offensive Security Certified Professional
# ==========================================
OSCP:
  beginner:
    - id: "oscp_b_001"
      question: "How many practice machines have you successfully rooted/owned so far?"
      type: "progress_check"
      options:
        A: "0-10 machines"
        B: "10-25 machines"
        C: "25-50 machines"
        D: "50-100+ machines"
      scoring:
        A: 0
        B: 1
        C: 2
        D: 3
      explanation: "OSCP exam requires practical experience. TJNull recommends 30+ machines before attempting the exam."
      topic: "Practical Experience"
      
    - id: "oscp_b_002"
      question: "Which practice platforms are you actively using?"
      type: "progress_check"
      options:
        A: "None yet, just reading about it"
        B: "TryHackMe only"
        C: "HackTheBox or Proving Grounds"
        D: "Multiple platforms (HTB, PG, THM)"
      scoring:
        A: 0
        B: 1
        C: 2
        D: 3
      explanation: "Diverse practice across platforms builds comprehensive skills needed for OSCP."
      topic: "Practice Platforms"
      
    - id: "oscp_b_003"
      question: "Can you perform a full Nmap scan and enumerate services without looking up commands?"
      type: "practical_experience"
      options:
        A: "No, I need to look up commands every time"
        B: "Basic scans only (-sV, -sC)"
        C: "Yes, comfortable with most flags"
        D: "Yes, including NSE scripts and custom scans"
      scoring:
        A: 0
        B: 1
        C: 2
        D: 3
      explanation: "Enumeration is fundamental. You should know Nmap by heart before attempting OSCP."
      topic: "Enumeration Skills"
      
    - id: "oscp_b_004"
      question: "How comfortable are you with manual exploitation (without Metasploit)?"
      type: "readiness_assessment"
      options:
        A: "Always use Metasploit"
        B: "Tried a few times, prefer Metasploit"
        C: "Comfortable with basics (reverse shells, file transfers)"
        D: "Prefer manual, only use MSF for specific tasks"
      scoring:
        A: 0
        B: 1
        C: 2
        D: 3
      explanation: "OSCP limits Metasploit use. Manual exploitation skills are critical."
      topic: "Exploitation Proficiency"
      
    - id: "oscp_b_005"
      question: "Have you successfully escalated privileges on both Linux and Windows machines?"
      type: "practical_experience"
      options:
        A: "No, not yet"
        B: "Yes, but with walkthroughs"
        C: "Yes, on a few machines independently"
        D: "Yes, on many machines using various techniques"
      scoring:
        A: 0
        B: 1
        C: 2
        D: 3
      explanation: "Privilege escalation is a major OSCP exam component. Both OS types appear in the exam."
      topic: "Privilege Escalation"

  intermediate:
    - id: "oscp_i_001"
      question: "How many Active Directory machines have you compromised end-to-end?"
      type: "progress_check"
      options:
        A: "None, haven't touched AD yet"
        B: "1-3 machines with guides"
